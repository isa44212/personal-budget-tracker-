<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Personal Budget & Expense Tracker</title>

    <!-- Link CSS file -->
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- Page Header -->
    <header>
        <h1>My Budget Tracker</h1>
        <p>Track your income and expenses in one place.</p>
    </header>

    <!-- Add Expense Section -->
    <section id="add-expense">
        <h2>Add Expense</h2>

        <div class="input-group">
            <label for="expense-name">Expense Name</label>
            <input
                type="text"
                id="expense-name"
                placeholder="Enter expense name"
            >
        </div>

        <div class="input-group">
            <label for="amount">Amount</label>
            <input
                type="number"
                id="amount"
                placeholder="Enter amount"
            >
        </div>

        <div class="input-group">
            <label for="category">Category</label>
            <input
                type="text"
                id="category"
                placeholder="e.g. Food, Transport"
            >
        </div>
    </section>

    <!-- Your Expenses Section -->
    <section id="expenses">
        <h2>Your Expenses</h2>

        <p class="placeholder">No expenses yet</p>
    </section>

</body>
</html>
